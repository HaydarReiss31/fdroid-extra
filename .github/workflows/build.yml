name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleFullNightlyRelease --no-daemon
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk -name '*unsigned*.apk' | head -1)
          $APKSIGNER sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass env:KS_PASS --out app-signed.apk "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: fdroid-root-installer
          path: app-signed.apk
